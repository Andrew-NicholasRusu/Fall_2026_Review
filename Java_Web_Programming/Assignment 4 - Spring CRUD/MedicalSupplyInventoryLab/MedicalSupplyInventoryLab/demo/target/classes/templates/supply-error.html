<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<main class="container pb-5" style="max-width: 640px;">
    <div class="alert alert-danger" role="alert">
        <h1 class="h5"><i class="bi bi-exclamation-triangle"></i> Something went wrong</h1>
        <p class="mb-0" th:text="${message}">An error occurred.</p>
    </div>
    <a th:href="@{/supplies}" class="btn btn-primary"><i class="bi bi-arrow-left"></i> Back to Inventory</a>
</main>
</body>
</html>

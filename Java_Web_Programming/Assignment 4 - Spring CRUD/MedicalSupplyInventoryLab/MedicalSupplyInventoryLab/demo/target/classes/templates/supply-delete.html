<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Medical Supply</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<main class="container pb-5" style="max-width: 640px;">

    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger-subtle text-danger text-center fw-semibold fs-5">
            <i class="bi bi-trash"></i> Delete Medical Supply
        </div>
        <div class="card-body">

            <p class="text-center fw-semibold">Are you sure you want to delete this medical supply?</p>

            <table class="table table-bordered">
                <tbody>
                <tr><th class="w-25">ID</th><td th:text="${supply.id}">1</td></tr>
                <tr><th>Name</th><td th:text="${supply.name}">Name</td></tr>
                <tr><th>Category</th><td th:text="${supply.category}">Category</td></tr>
                <tr><th>Vendor</th><td th:text="${supply.vendor}">Vendor</td></tr>
                <tr><th>Price</th>
                    <td th:text="'$' + ${#numbers.formatDecimal(supply.unitPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</td></tr>
                <tr><th>Quantity</th><td th:text="${supply.quantity}">0</td></tr>
                <tr><th>Description</th><td th:text="${supply.description}">Description</td></tr>
                </tbody>
            </table>

            <!-- POST, so nothing is deleted just by opening a link -->
            <form th:action="@{/supplies/delete/{id}(id=${supply.id})}" method="post"
                  class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Yes, Delete
                </button>
                <a th:href="@{/supplies}" class="btn btn-secondary">Cancel</a>
            </form>

        </div>
    </div>
</main>
</body>
</html>

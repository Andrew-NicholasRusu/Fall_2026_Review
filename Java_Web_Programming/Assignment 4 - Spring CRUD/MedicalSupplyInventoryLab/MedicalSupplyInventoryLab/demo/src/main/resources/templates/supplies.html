<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medical Supply Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Medical Supply Inventory</h1>
        </div>
        <a th:href="@{/supplies/new}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Add Medical Supply
        </a>
    </div>

    <!-- Success message shown after add / update / delete -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Vendor</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Quantity</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(supplies)}">
                    <td colspan="8" class="text-center text-muted py-4">No medical supplies found.</td>
                </tr>
                <tr th:each="supply : ${supplies}">
                    <td th:text="${supply.id}">1</td>
                    <td th:text="${supply.name}">Name</td>
                    <td th:text="${supply.category}">Category</td>
                    <td th:text="${supply.vendor}">Vendor</td>
                    <td class="text-end"
                        th:text="'$' + ${#numbers.formatDecimal(supply.unitPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td class="text-end" th:text="${supply.quantity}">0</td>
                    <td th:text="${supply.description}">Description</td>
                    <td class="text-nowrap">
                        <a th:href="@{/supplies/edit/{id}(id=${supply.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-pencil"></i> Update
                        </a>
                        <a th:href="@{/supplies/delete/{id}(id=${supply.id})}" class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            Showing <span th:text="${#lists.size(supplies)}">0</span> entries
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

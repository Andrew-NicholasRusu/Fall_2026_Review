<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medical Supply</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<main class="container pb-5" style="max-width: 760px;">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0"
                th:text="${supply.id == null ? 'Add Medical Supply' : 'Update Medical Supply'}">Add Medical Supply</h1>
            <p class="text-muted mb-0"
               th:text="${supply.id == null ? 'Enter the details of the new medical supply.' : 'Modify the details of the selected medical supply.'}">
                Enter the details of the new medical supply.</p>
        </div>
        <a th:href="@{/supplies}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to List
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/supplies/save}" th:object="${supply}" method="post" novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="mb-3" th:if="${supply.id != null}">
                    <label class="form-label fw-semibold">ID</label>
                    <input type="text" class="form-control" th:value="${supply.id}" disabled>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
                    <input type="text" id="name" class="form-control" th:field="*{name}"
                           th:errorclass="is-invalid" placeholder="Enter supply name">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                    <input type="text" id="category" class="form-control" th:field="*{category}"
                           th:errorclass="is-invalid" placeholder="Enter category ">
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>

                <div class="mb-3">
                    <label for="vendor" class="form-label fw-semibold">Vendor <span class="text-danger">*</span></label>
                    <input type="text" id="vendor" class="form-control" th:field="*{vendor}"
                           th:errorclass="is-invalid" placeholder="Enter vendor name">
                    <div class="invalid-feedback" th:errors="*{vendor}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="unitPrice" class="form-label fw-semibold">Unit Price <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0" id="unitPrice" class="form-control"
                                   th:field="*{unitPrice}" th:errorclass="is-invalid" placeholder="0.00">
                            <div class="invalid-feedback" th:errors="*{unitPrice}"></div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="quantity" class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
                        <input type="number" min="0" step="1" id="quantity" class="form-control"
                               th:field="*{quantity}" th:errorclass="is-invalid" placeholder="0">
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description" rows="3" class="form-control" th:field="*{description}"
                              th:errorclass="is-invalid" placeholder="Enter a brief description..."></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i>
                    <span th:text="${supply.id == null ? 'Save' : 'Update'}">Save</span>
                </button>
                <a th:href="@{/supplies}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
